get_savings:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: little_monkey
    period:
      required: true
      default: week
      selector:
        select:
          translation_key: savings_period
          options:
            - week
            - month
            - year
    date:
      selector:
        date:
get_consumption_analysis:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: little_monkey
    period:
      required: true
      default: week
      selector:
        select:
          translation_key: savings_period
          options:
            - week
            - month
    date:
      selector:
        date:
get_category_history:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: little_monkey
    category:
      required: true
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    date:
      selector:
        date:
get_activations:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: little_monkey
    page:
      default: 0
      selector:
        number:
          min: 0
          max: 365
          mode: box
get_equipments:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: little_monkey
set_equipment_mode:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: little_monkey
    mode:
      required: true
      default: forced
      selector:
        select:
          translation_key: equipment_mode
          options:
            - auto
            - forced
            - absence
            - "on"
            - "off"
    duration:
      selector:
        number:
          min: 1
          max: 527040
          unit_of_measurement: min
          mode: box
    until:
      selector:
        datetime:
get_measures:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: little_monkey
    measure:
      required: true
      default: electricity
      selector:
        select:
          translation_key: measure
          options:
            - electricity
            - temperature
            - humidity
    period:
      required: true
      default: day
      selector:
        select:
          translation_key: measure_period
          options:
            - day
            - week
            - month
            - year
    date:
      selector:
        date:
    check:
      advanced: true
      default: false
      selector:
        boolean:
