name: "Tests"

on:
  push:
    branches:
      - "main"
  # Every pull request, including those stacked on another branch
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Set up Python"
          uses: actions/setup-python@v7
          with:
            python-version: "3.13"
            cache: "pip"

        - name: "Install requirements"
          run: python3 -m pip install -r requirements_test.txt

        - name: "Run"
          run: python3 -m pytest tests

  home-assistant:
    name: "Pytest in Home Assistant"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Set up Python"
          uses: actions/setup-python@v7
          with:
            # Version required by the latest Home Assistant
            python-version: "3.14"
            cache: "pip"

        - name: "Install requirements"
          run: python3 -m pip install -r requirements_test_ha.txt

        - name: "Run"
          run: python3 -m pytest tests

  home-assistant-minimum:
    name: "Pytest in the minimum Home Assistant"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Set up Python"
          uses: actions/setup-python@v7
          with:
            # Version required by the Home Assistant of requirements_test_ha_min.txt
            python-version: "3.12"
            cache: "pip"

        - name: "Install requirements"
          run: python3 -m pip install -r requirements_test_ha_min.txt

        - name: "Run"
          run: python3 -m pytest tests
