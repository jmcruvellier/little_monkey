name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Adjust version number"
        shell: "bash"
        env:
          # Passed through the environment so that the tag name
          # is never interpreted by the shell
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # The tag is v1.2.8, the version of the integration is 1.2.8
          export VERSION="${TAG_NAME#v}"
          yq -i -o json '.version = strenv(VERSION)' \
            "${{ github.workspace }}/custom_components/little_monkey/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          # The archive is built from a copy without the res folder: its
          # images only illustrate the documentation on GitHub
          SOURCE="${{ github.workspace }}/custom_components/little_monkey"
          STAGING="${{ runner.temp }}/little_monkey"
          mkdir -p "$STAGING"
          cp -r "$SOURCE/." "$STAGING/"
          rm -rf "$STAGING/res"
          cd "$STAGING"
          zip "$SOURCE/little_monkey.zip" -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/custom_components/little_monkey/little_monkey.zip
