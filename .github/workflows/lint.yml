name: "Lint"

on:
  push:
    branches:
      - "main"
      - "dev/**"
  pull_request:
    branches:
      - "main"
      - "dev/**"

jobs:
  ruff:
    permissions:
      contents: read
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Set up Python"
          uses: actions/setup-python@v7
          with:
            python-version: "3.13"
            cache: "pip"

        - name: "Install requirements"
          run: python3 -m pip install -r requirements_test.txt

        - name: "Run"
          run: python3 -m ruff check .
